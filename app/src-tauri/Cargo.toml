[package]
name = "omebly-downloader"
version = "0.2.1"
description = "Omebly Downloader: downloads videos, audio, images and files at full speed"
edition = "2021"
license = "GPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip"] }
futures-util = "0.3"
url = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
